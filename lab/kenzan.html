<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>見参 演出くらべ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
:root{--ink:#3a2412;--gold:#ffcd3c}
html,body{margin:0;height:100%;background:#1d1108;color:#fff;font-family:"M PLUS Rounded 1c",sans-serif;overflow:hidden;touch-action:manipulation}
#wrap{position:relative;max-width:430px;height:100%;margin:0 auto;display:flex;flex-direction:column}
header{padding:10px 14px 6px;text-align:center}
header b{font-family:"Dela Gothic One";font-size:20px;color:var(--gold);letter-spacing:.05em}
header p{margin:2px 0 0;font-size:12px;color:#e8d3b0}
.tabs{display:flex;gap:8px;padding:6px 14px}
.tabs button{flex:1;font:800 15px "M PLUS Rounded 1c";padding:10px 0;border-radius:14px;border:0;background:#5a3a22;color:#f4e2c2;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25)}
.tabs button.on{background:linear-gradient(#ffe48a,#f2b632);color:var(--ink)}
#stage{position:relative;flex:1;margin:6px 10px;border-radius:18px;overflow:hidden;background:#2a1408 url(../bg/stage_hill.jpg) center/cover}
#stage canvas{position:absolute;inset:0;width:100%;height:100%}
#dom{position:absolute;inset:0}
.replay{margin:8px 14px calc(12px + env(safe-area-inset-bottom));font:800 17px "M PLUS Rounded 1c";padding:14px 0;border:0;border-radius:999px;background:linear-gradient(#7be08a,#2fa84a);color:#fff;box-shadow:0 4px 0 #1d6e30}
/* いまの演出（ゲームと 同じ しくみ） */
.u{position:absolute;left:50%;top:52%;width:92px;height:92px;margin:-46px 0 0 -46px;border-radius:50%;background:center/cover;border:4px solid #fff;box-shadow:0 4px 10px rgba(0,0,0,.5)}
.sumring{position:absolute;inset:-14px;border-radius:50%;border:4px solid #fff2b0;box-shadow:0 0 20px #ffcd3c;animation:sumring .8s ease-out forwards}
@keyframes sumring{0%{transform:scale(.3);opacity:1}100%{transform:scale(1.7);opacity:0}}
.pt{position:absolute;width:26px;height:26px;background:center/contain no-repeat;pointer-events:none}
.flt{position:absolute;left:50%;transform:translateX(-50%);font-weight:800;font-size:15px;color:#fff;text-shadow:0 2px 0 #000;white-space:nowrap;animation:flt 1.2s ease-out forwards}
@keyframes flt{from{opacity:1;translate:0 0}to{opacity:0;translate:0 -40px}}
.bubble{position:absolute;left:50%;bottom:105%;transform:translateX(-50%);background:#fff;color:var(--ink);font-weight:800;font-size:12px;padding:5px 10px;border-radius:12px;white-space:nowrap}
.kbadge{position:absolute;left:50%;top:18%;transform:translateX(-50%);background:#fff;color:var(--ink);font-weight:800;font-size:13px;padding:8px 12px;border-radius:12px;border:3px solid #ff8a3d;max-width:80%;text-align:center}
</style></head><body>
<div id="wrap">
  <header><b>見参！ 演出くらべ</b><p>おなじ「見はり番ドッグ」を 出したときの 演出だよ</p></header>
  <div class="tabs"><button id="tOld">いまの 演出</button><button id="tNew" class="on">新しい 演出</button></div>
  <div id="stage"><div id="dom"></div></div>
  <button class="replay" id="again">もう一度 見る</button>
</div>
<script>
const ART='dog.webp',SPARK='../ui/x_spark.png',STAR='../ui/x_star.png',LINE='キャン！敵しゅう〜！';
const stage=document.getElementById('stage'),dom=document.getElementById('dom');
let mode='new',run=0;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ---------- いまの 演出（ゲームと 同じ） ---------- */
async function playOld(){const my=++run;dom.innerHTML='';cx2.clearRect(0,0,cv.width,cv.height);
  await sleep(300);if(my!==run)return;
  const u=document.createElement('div');u.className='u';u.style.backgroundImage=`url(${ART})`;dom.appendChild(u);
  const r=document.createElement('div');r.className='sumring';u.appendChild(r);
  for(let i=0;i<8;i++){const p=document.createElement('span');p.className='pt';p.style.backgroundImage=`url(${i%2?STAR:SPARK})`;p.style.left='33px';p.style.top='33px';u.appendChild(p);
    const a=Math.random()*Math.PI*2,d=40+Math.random()*30;p.animate([{transform:'translate(0,0) scale(.4)',opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px) scale(1)`,opacity:0}],{duration:800,easing:'ease-out',fill:'forwards'})}
  const f=document.createElement('div');f.className='flt';f.style.top='-30px';f.textContent='でてきたぞ！';u.appendChild(f);
  const b=document.createElement('div');b.className='bubble';b.textContent=LINE;u.appendChild(b);setTimeout(()=>b.remove(),1700);
  await sleep(900);if(my!==run)return;
  const k=document.createElement('div');k.className='kbadge';k.textContent='見参！ あいての 手札を ぜんぶ 見る';dom.appendChild(k);
}

/* ---------- 新しい 演出（ゲーム用の 描きかた：キャンバスに 毎コマ 描く） ---------- */
const cv=document.createElement('canvas');stage.insertBefore(cv,dom);const cx2=cv.getContext('2d');
const IM={};[['art',ART],['spark',SPARK],['star',STAR]].forEach(([k,u])=>{const i=new Image();i.src=u;IM[k]=i});
let W=0,H=0,DPR=1;function fit(){DPR=Math.min(2,devicePixelRatio||1);W=stage.clientWidth;H=stage.clientHeight;cv.width=W*DPR;cv.height=H*DPR}addEventListener('resize',fit);fit();
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),seg=(t,a,b)=>cl((t-a)/(b-a)),E3=t=>1-Math.pow(1-t,3),EB=t=>{const c=1.9;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)},EIO=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
let R=null;
function rnd(n){let x=Math.sin(n*9301+49297)*233280;return x-Math.floor(x)}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function draw(t){const c=cx2;c.setTransform(DPR,0,0,DPR,0,0);c.clearRect(0,0,W,H);const cx=W/2,cy=H*.5;
  /* ゆれ */const sk=t>780&&t<1160?(1-(t-780)/380)*7:0;c.translate((rnd(t|0)-.5)*2*sk,(rnd((t|0)+7)-.5)*2*sk);
  const out=1-seg(t,2900,3400);
  /* 暗く */c.fillStyle=`rgba(26,10,0,${.55*E3(seg(t,250,600))*out})`;c.fillRect(-20,-20,W+40,H+40);
  /* 光の すじ */const ra=E3(seg(t,780,1080))*out;if(ra>0){c.save();c.translate(cx,cy);c.rotate(t/1000*.36);c.scale(.5+.5*ra,.5+.5*ra);c.globalCompositeOperation='lighter';for(let i=0;i<16;i++){const a0=i/16*Math.PI*2;c.fillStyle=`rgba(255,242,176,${(i%2?.45:.22)*ra})`;c.beginPath();c.moveTo(0,0);c.arc(0,0,420,a0,a0+Math.PI/30);c.closePath();c.fill()}c.restore()}
  /* しょうげきは */[[780,650,10,'255,211,74'],[980,850,6,'255,255,255']].forEach(([s,d,w,col])=>{const k=seg(t,s,s+d);if(k<=0||k>=1)return;c.strokeStyle=`rgba(${col},${1-k})`;c.lineWidth=w;c.beginPath();c.arc(cx,cy,60*(.4+2.6*E3(k)),0,Math.PI*2);c.stroke()});
  /* すなけむり */for(let i=0;i<16;i++){const s=780,k=(t-s)/900;if(k<0||k>1)continue;const a=Math.PI+rnd(i)*Math.PI,x=cx+(rnd(i+3)-.5)*80+Math.cos(a)*90*E3(k),y=cy+70+Math.sin(a)*25*E3(k);c.fillStyle=`rgba(201,162,122,${.5*(1-k)})`;c.beginPath();c.arc(x,y,14+26*k,0,Math.PI*2);c.fill()}
  /* カード */const ks=seg(t,250,670),sq=seg(t,670,780);let y=H+120+(cy-(H+120))*E3(ks),rot=-.35*(1-E3(ks)),sc=.6+.75*E3(ks);if(t>=670)sc=1.35-.35*EIO(sq);if(t>1160)y=cy+Math.sin(t/380)*3;
  if(t>250){const CW=118,CH=150;c.save();c.translate(cx,y);c.rotate(rot);c.scale(sc,sc);
    const g=E3(seg(t,780,1180));if(g>0){c.shadowColor=`rgba(255,211,74,${g})`;c.shadowBlur=36}c.fillStyle='#8a5a1c';rr(c,-CW/2,-CH/2,CW,CH,14);c.fill();c.shadowBlur=0;
    c.fillStyle='#ffd76a';rr(c,-CW/2+4,-CH/2+4,CW-8,CH-8,11);c.fill();
    c.save();rr(c,-CW/2+8,-CH/2+8,CW-16,CW-16,9);c.clip();if(IM.art.complete)c.drawImage(IM.art,-CW/2+8,-CH/2+8,CW-16,CW-16);c.restore();
    c.fillStyle='#3a2412';c.font='800 13px "M PLUS Rounded 1c"';c.textAlign='center';c.textBaseline='middle';c.fillText('見はり番ドッグ',0,CH/2-20);
    const sh=seg(t,1160,1660);if(sh>0&&sh<1){c.save();rr(c,-CW/2,-CH/2,CW,CH,14);c.clip();const sx=-CW+CW*2.2*EIO(sh);c.fillStyle='rgba(255,255,255,.6)';c.beginPath();c.moveTo(sx-20,-CH);c.lineTo(sx+8,-CH);c.lineTo(sx-8,CH);c.lineTo(sx-36,CH);c.fill();c.restore()}
    c.restore()}
  /* のぼる 光 */c.globalCompositeOperation='lighter';
  for(let i=0;i<14;i++){const k=(t-250-rnd(i)*120)/600;if(k<0||k>1)continue;c.fillStyle=`rgba(255,224,138,${1-k})`;c.beginPath();c.arc(cx+(rnd(i+1)-.5)*60,H+40-(H*.5)*E3(k),3,0,Math.PI*2);c.fill()}
  /* キラキラ（はじける） */for(let i=0;i<26;i++){const life=1000+rnd(i+5)*600,k=(t-780)/life;if(k<0||k>1)continue;const tt=(t-780)/16.7,a=rnd(i+11)*Math.PI*2,v=6+rnd(i+13)*7,dr=Math.pow(.95,tt),dist=v*(1-dr)/.05;
    const x=cx+Math.cos(a)*dist,yy=cy+Math.sin(a)*dist-3*(1-dr)/.05+.22*tt*tt*.35;const im=i%3?IM.spark:IM.star,s=(.22+rnd(i+17)*.2)*126;c.globalAlpha=Math.min(1,(1-k)/.4);if(im.complete){c.save();c.translate(x,yy);c.rotate(tt*.1*(rnd(i)-.5));c.drawImage(im,-s/2,-s/2,s,s);c.restore()}}
  c.globalAlpha=1;for(let i=0;i<18;i++){const st=1160+rnd(i+21)*300,k=(t-st)/(1600+rnd(i+23)*900);if(k<0||k>1)continue;c.fillStyle=`rgba(255,242,176,${(1-k)*out})`;c.beginPath();c.arc(cx+(rnd(i+25)-.5)*130,cy+70-k*120,2+rnd(i+27)*3,0,Math.PI*2);c.fill()}
  c.globalCompositeOperation='source-over';
  /* 白い フラッシュ */const fl=1-seg(t,780,1040);if(t>=780&&fl>0){c.fillStyle=`rgba(255,255,255,${fl})`;c.fillRect(-20,-20,W+40,H+40)}
  /* 見参！ */const tk=seg(t,900,1160);if(tk>0){const s2=3-2*EB(tk);c.save();c.globalAlpha=Math.min(1,tk*2)*out;c.translate(cx,cy-130);c.scale(s2,s2);c.font='58px "Dela Gothic One"';c.textAlign='center';c.textBaseline='middle';
    c.lineJoin='round';c.lineWidth=12;c.strokeStyle='#3e1a06';c.shadowColor='rgba(0,0,0,.6)';c.shadowOffsetY=5;c.shadowBlur=4;c.strokeText('見参！',0,0);c.shadowColor='transparent';
    const gr=c.createLinearGradient(0,-30,0,30);gr.addColorStop(0,'#fffbe0');gr.addColorStop(.3,'#ffe066');gr.addColorStop(.62,'#ffb31a');gr.addColorStop(1,'#ff7a00');c.fillStyle=gr;c.fillText('見参！',0,0);c.restore()}
  const sb=seg(t,1160,1460);if(sb>0){c.save();c.globalAlpha=sb*out;c.font='800 16px "M PLUS Rounded 1c"';c.textAlign='center';c.textBaseline='middle';c.lineJoin='round';c.lineWidth=6;c.strokeStyle='#3e1a06';const yy=cy-72-10*sb;c.strokeText('あいての 手札を ぜんぶ 見る！',cx,yy);c.fillStyle='#fff';c.fillText('あいての 手札を ぜんぶ 見る！',cx,yy);c.restore()}
  /* セリフ */const bk=seg(t,1160,1460);if(bk>0&&t<3400){const s3=EB(bk);c.save();c.translate(cx,cy+118);c.scale(s3,s3);c.font='800 14px "M PLUS Rounded 1c"';const w=c.measureText(LINE).width;c.fillStyle='#fff';rr(c,-w/2-12,-16,w+24,32,16);c.fill();c.beginPath();c.moveTo(-8,-15);c.lineTo(8,-15);c.lineTo(0,-27);c.fill();c.fillStyle='#3a2412';c.textAlign='center';c.textBaseline='middle';c.fillText(LINE,0,1);c.restore()}
}
function playNew(){const my=++run;dom.innerHTML='';fit();cv.style.display='';const t0=performance.now();const loop=()=>{if(my!==run)return;const t=performance.now()-t0;draw(t);if(t<3600)requestAnimationFrame(loop)};requestAnimationFrame(loop)}
window.__draw=t=>{fit();draw(t)};
function play(){if(mode==='new')playNew();else playOld()}
document.getElementById('tOld').onclick=()=>{mode='old';tOld.classList.add('on');tNew.classList.remove('on');play()};
document.getElementById('tNew').onclick=()=>{mode='new';tNew.classList.add('on');tOld.classList.remove('on');play()};
document.getElementById('again').onclick=()=>play();
(document.fonts&&document.fonts.load?Promise.all([document.fonts.load('58px "Dela Gothic One"','見参'),document.fonts.load('800 14px "M PLUS Rounded 1c"','あ')]):Promise.resolve()).finally(()=>setTimeout(play,300));
</script>
</body></html>
