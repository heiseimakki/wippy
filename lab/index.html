<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>キャンバス演出 ずかん</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;800;900&display=swap">
<style>
:root{--ink:#3a2412;--gold:#ffcd3c;--panel:rgba(40,20,8,.88)}
*{box-sizing:border-box;touch-action:manipulation}
html,body{margin:0;height:100%;background:#1d1108;color:#fff;font-family:"M PLUS Rounded 1c",sans-serif;overflow:hidden}
#wrap{position:relative;max-width:430px;height:100%;margin:0 auto;display:flex;flex-direction:column}
header{padding:12px 14px 6px;text-align:center}
header b{font-family:"Dela Gothic One";font-size:21px;color:var(--gold);letter-spacing:.04em}
header p{margin:3px 0 0;font-size:12px;color:#e8d3b0}
#menu{flex:1;overflow:auto;padding:4px 12px 20px}
.cat{margin:10px 0 4px;font-weight:900;font-size:14px;color:#ffe9b0;display:flex;align-items:center;gap:6px}
.cat i{font-style:normal;font-size:11px;color:#c9b08a;font-weight:800}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.it{background:var(--panel);border:2px solid #6b4a2a;border-radius:12px;padding:8px 10px;text-align:left;color:#fff;font:inherit;cursor:pointer}
.it b{display:block;font-size:14px;font-weight:900}
.it small{display:block;font-size:10.5px;color:#d9c4a0;line-height:1.35;margin-top:2px}
.it.new{border-color:#ffcd3c;box-shadow:0 0 10px rgba(255,205,60,.4)}
.it.soon{opacity:.45;pointer-events:none}
#player{position:absolute;inset:0;display:none;flex-direction:column;background:#1d1108}
#player.on{display:flex}
.ptop{display:flex;align-items:center;gap:8px;padding:10px 12px 4px}
.ptop button{font:900 14px inherit;border:2px solid #a07a4a;background:rgba(255,255,255,.08);color:#ffe9b0;border-radius:10px;padding:6px 12px}
.ptop .ttl{flex:1;text-align:center}
.ptop .ttl b{display:block;font-family:"Dela Gothic One";font-size:18px;color:var(--gold)}
.ptop .ttl small{font-size:11px;color:#d9c4a0}
#stage{position:relative;flex:1;margin:6px 10px;border-radius:18px;overflow:hidden;background:#2a1408 url(../bg/stage_hill.jpg) center/cover}
#stage canvas{position:absolute;inset:0;width:100%;height:100%}
.pbot{display:flex;gap:8px;padding:6px 12px calc(12px + env(safe-area-inset-bottom))}
.pbot button{flex:1;font:900 15px inherit;padding:13px 0;border:0;border-radius:999px;color:#fff}
#again{flex:2;background:linear-gradient(#7be08a,#2fa84a);box-shadow:0 4px 0 #1d6e30}
#prev,#next{background:#5a3a22;box-shadow:0 4px 0 #2a180c}
</style></head><body>
<div id="wrap">
  <header><b>キャンバス演出 ずかん</b><p>新しい 演出を ひとつずつ 見られるよ（ゲームには まだ 入っていません）</p></header>
  <div id="menu"></div>
  <div id="player">
    <div class="ptop"><button id="back">← もくじ</button><div class="ttl"><b id="pt"></b><small id="pd"></small></div><span style="width:70px"></span></div>
    <div id="stage"><canvas id="cv"></canvas></div>
    <div class="pbot"><button id="prev">◀</button><button id="again">もう一度</button><button id="next">▶</button></div>
  </div>
</div>
<script src="fx.js"></script>
<script>
const F=FX,{P,E}=F;
const U=i=>F.units()[i];
const pos=u=>F.P(u);
const hero=s=>F.P(F.heroes()[s]);
/* よく つかう 場面 */
const S1={foes:[{art:'jab',atk:2,hp:3},{art:'iguana',atk:2,hp:2}],mine:[{art:'dog',atk:2,hp:3},{art:'juko',atk:2,hp:4}]};
const S2={foes:[{art:'jab',atk:2,hp:3},{art:'iguana',atk:2,hp:2},{art:'kurogoke',atk:2,hp:2}],mine:[{art:'dog',atk:2,hp:3}]};
/* 出てくる 動き（共通） */
function enter(u,t=200,from=1.25){const {H}=F.dims();const y0=u.y;u.y=from;u.rot=-.4;u.sc=.6;
  F.tween(u,{t,d:380,y:y0,rot:0,sc:1.35});F.tween(u,{t:t+380,d:110,sc:1,e:E.io});
  F.at(t+490,()=>{const p=pos(u);F.ring(p.x,p.y,{t:t+490,r1:110});F.ring(p.x,p.y,{t:t+620,col:'255,255,255',w:5,r1:150,d:800});F.smoke(p.x,p.y+u.r,{t:t+490});F.shake({t:t+490,p:6})});
  return t+490}
function hitAt(u,t,n,o={}){F.at(t,()=>{const p=pos(u);F.burst(p.x,p.y,{t,n:o.n||8,im:o.im||'x_hit',sp:5,g:.1,life:500,sz:.3});F.floatTxt('-'+n,p.x,p.y-20,{t,col:'#ffdddd',size:26});F.keyf(u,{t,d:300,fn:(u,k)=>{u.ox=(Math.random()-.5)*10*(1-k);u.tint=`rgba(255,40,40,${.45*(1-k)})`}});F.keyf(u,{t:t+300,d:20,fn:u=>{u.ox=0;u.tint=null}});u.hp=Math.max(0,u.hp-n)})}
function ko(u,t){F.keyf(u,{t,d:500,fn:(u,k)=>{u.gray=k;u.ox=(Math.random()-.5)*8;u.rot=k*.3}});F.tween(u,{t:t+500,d:280,sc:.2,alpha:0,e:E.io});F.at(t+560,()=>{const p=pos(u);F.smoke(p.x,p.y,{t:t+560,n:14,col:'230,220,210',spread:70,r:18});F.burst(p.x,p.y,{t:t+560,n:6,im:'x_star',sp:4,g:.05,life:800,sz:.2})});return t+780}
const LIST=[
 {cat:'きほん',items:[
  {k:'kenzan',n:'見参！',d:'カードを 出した しゅんかん',stage:{foes:S1.foes,mine:[{art:'dog'},{art:'eagle',atk:6,hp:7}]},total:3400,build(){const u=U(3);F.darken({t:150,d:3000});const t=enter(u);
   F.rays(pos(u).x,pos(u).y,{t,d:2600});F.at(t,()=>{const p=pos(u);F.burst(p.x,p.y,{t,n:24,im:['x_spark','x_star'],sp:7,sz:.25});F.flash({t,d:240,a:.85})});
   F.slam('見参！',F.dims().W/2,F.dims().H*.5-40,{t:t+120,d:2200,sub:'空から 見まもっておる！'});F.keyf(u,{t,d:2400,fn:(u,k)=>{u.glow=Math.sin(k*Math.PI)}})}},
  {k:'yarare',n:'やられたら',d:'たおれた ときに 出る 効果',stage:{foes:S1.foes,mine:[{art:'new03',atk:4,hp:1},{art:'juko'}]},total:3600,build(){const u=U(2);ko(u,300);const p0=pos(u);
   F.at(1150,()=>{F.icon('u_k_dr',p0.x,p0.y,{t:1150,d:1300,sz:70,bob:4});F.ring(p0.x,p0.y,{t:1150,col:'170,120,255',r1:90})});
   F.slam('やられたら',F.dims().W/2,F.dims().H*.5,{t:1350,d:1500,size:42,grad:['#f0e0ff','#c99aff','#8a5ad0','#5a2aa0'],stroke:'#1e0a3a',sub:'のろいの 手紙が とんでいく…'});
   F.at(2050,()=>{const tg=pos(U(0));F.shot(p0,tg,{t:2050,d:420,im:'x_card',sz:34,arc:90,trail:'190,140,255',onHit:tt=>{}})});hitAt(U(0),2470,1,{im:'x_skull'})}},
  {k:'irua',n:'いるあいだ',d:'場に いる あいだ ずっと つづく 力',stage:{foes:S1.foes,mine:[{art:'dog'},{art:'juko'},{art:'jacka'}]},total:3000,build(){const u=U(3);
   for(let i=0;i<3;i++){F.at(300+i*600,tt=>{const p=pos(u);F.ring(p.x,p.y,{t:tt,col:'255,215,90',r1:170,w:6,d:900})})}
   F.keyf(u,{t:200,d:2400,fn:(u,k)=>{u.glow=.6+.4*Math.sin(k*20)}});[2,4].forEach((i,j)=>{F.at(700+j*150,tt=>{const p=pos(U(i));F.burst(p.x,p.y,{t:tt,n:6,im:'x_star',sp:3,g:-.05,life:900,sz:.18});F.floatTxt('攻撃+1',p.x,p.y-30,{t:tt,col:'#ffe066',size:16})})})}},
  {k:'attack',n:'こうげき',d:'なかまが あいてに ぶつかる',stage:S1,total:2400,build(){const a=U(2),t=U(0);const pa=pos(a),pt=pos(t);
   F.tween(a,{t:250,d:160,oy:20,sc:1.1});F.keyf(a,{t:410,d:180,fn:(u,k)=>{u.ox=(pt.x-pa.x)*E.io(k);u.oy=20+(pt.y-pa.y-20)*E.io(k)}});
   F.at(590,()=>{F.flash({t:590,d:120,a:.5});F.shake({t:590,p:9,d:300});F.burst(pt.x,pt.y,{t:590,n:10,im:'x_pow',sp:6,g:.1,life:500,sz:.35});F.icon('x_pow',pt.x,pt.y,{t:590,d:350,sz:90})});hitAt(t,590,2);
   F.keyf(a,{t:600,d:380,fn:(u,k)=>{u.ox=(pt.x-pa.x)*(1-E.o(k));u.oy=(pt.y-pa.y)*(1-E.o(k));u.sc=1.1-.1*k}});F.at(1000,()=>{a.ox=0;a.oy=0})}},
  {k:'ko',n:'やられ（たおれる）',d:'体力が 0に なったとき',stage:S1,total:2000,build(){hitAt(U(1),300,2);ko(U(1),700)}},
  {k:'hero',n:'親分に ダメージ',d:'あいての 親分に とどいた！',stage:{foes:[],mine:[{art:'dog'},{art:'eagle',atk:6}]},total:2200,build(){const a=U(1),h=F.heroes().foe;const pa=pos(a),ph=hero('foe');
   F.keyf(a,{t:300,d:220,fn:(u,k)=>{u.ox=(ph.x-pa.x)*E.io(k);u.oy=(ph.y-pa.y)*E.io(k)}});F.at(520,()=>{F.flash({t:520,d:180,col:'255,60,60',a:.35});F.shake({t:520,p:12});F.burst(ph.x,ph.y,{t:520,n:14,im:['x_pow','x_star'],sp:7,life:700});F.floatTxt('-6',ph.x,ph.y+10,{t:520,size:34,col:'#ffd0d0'});h.hp-=6});
   F.keyf(a,{t:530,d:400,fn:(u,k)=>{u.ox=(ph.x-pa.x)*(1-E.o(k));u.oy=(ph.y-pa.y)*(1-E.o(k))}});F.keyf(h,{t:520,d:500,fn:(u,k)=>{u.ox=(Math.random()-.5)*14*(1-k)}})}},
 ]},
 {cat:'見参の 効果',items:[
  {k:'bc_dmg',n:'ダメージ',d:'ねらって うつ（アニー など）',stage:{foes:S1.foes,mine:[{art:'annie',atk:2,hp:1}]},total:2400,build(){const a=U(2),t=U(0);F.at(300,()=>{F.icon('x_muzzle',pos(a).x,pos(a).y-30,{t:300,d:200,sz:50})});F.shot(pos(a),pos(t),{t:320,d:240,im:'x_bullet',sz:24});F.at(560,()=>F.shake({t:560,p:6}));hitAt(t,560,2)}},
  {k:'bc_aoe',n:'ぜんたい ダメージ',d:'あいて ぜんいんに',stage:S2,total:2600,build(){const {W,H}=F.dims();F.darken({t:100,d:2200,a:.35});F.at(300,()=>{F.ring(W/2,H*.36,{t:300,r1:W*.7,w:14,col:'255,140,60',d:700});F.shake({t:300,p:10,d:500});F.flash({t:300,d:200,col:'255,180,90',a:.6})});[0,1,2].forEach(i=>hitAt(U(i),380+i*60,1,{im:'x_fire'}))}},
  {k:'bc_heal',n:'かいふく',d:'なかまの 体力を いやす',stage:{foes:S1.foes,mine:[{art:'dog',hp:1},{art:'juko',hp:2},{art:'sabota'}]},total:2400,build(){[2,3].forEach((i,j)=>{F.at(300+j*120,tt=>{const p=pos(U(i));F.dots(p.x,p.y+20,{t:tt,n:22,col:'140,255,160',up:2.2,life:1100,area:70});F.burst(p.x,p.y,{t:tt,n:6,im:'x_heal',sp:2,g:-.1,life:1000,sz:.22});F.floatTxt('+2',p.x,p.y-24,{t:tt+150,col:'#9dffb0'});U(i).hp+=2;F.keyf(U(i),{t:tt,d:800,fn:(u,k)=>{u.glow=Math.sin(k*Math.PI);u.glowC='140,255,160'}})})})}},
  {k:'bc_buff',n:'パワーアップ',d:'なかまが 強くなる（+2/+2）',stage:{foes:S1.foes,mine:[{art:'dog'},{art:'juko'}]},total:2400,build(){const u=U(2);F.at(300,tt=>{const p=pos(u);F.ring(p.x,p.y,{t:tt,r1:70,col:'255,215,90',d:500});F.ring(p.x,p.y,{t:tt+200,r1:90,col:'255,255,255',w:4,d:600});F.dots(p.x,p.y+30,{t:tt,n:26,up:3,col:'255,220,120',life:900,area:60});F.floatTxt('+2/+2',p.x,p.y-30,{t:tt+200,col:'#ffe066',size:26});u.atk+=2;u.hp+=2});F.tween(u,{t:300,d:200,sc:1.25});F.tween(u,{t:500,d:300,sc:1,e:E.b});F.keyf(u,{t:300,d:1200,fn:(u,k)=>{u.glow=Math.sin(k*Math.PI)}})}},
  {k:'bc_stun',n:'酔わせる',d:'1回休み（カンカン など）',stage:S1,total:2600,build(){const t=U(0);F.shot(pos(U(2)),pos(t),{t:300,d:420,im:'x_bottle',sz:34,arc:70,spin:1});F.at(720,tt=>{const p=pos(t);F.burst(p.x,p.y,{t:tt,n:10,im:'x_splash',sp:4,life:600,sz:.25,add_:false})});
   F.overlay(t,{t:720,d:1800,draw:(x,y,r,e)=>{const c=F.ctx();for(let i=0;i<3;i++){const a=e/400+i*2.1;const I=F.ui('x_dizzy');if(I.complete){c.drawImage(I,x+Math.cos(a)*r*.8-10,y-r-8+Math.sin(a)*6-10,20,20)}}}});F.keyf(t,{t:720,d:1800,fn:(u,k)=>{u.rot=Math.sin(k*20)*.15;u.tint='rgba(255,120,170,.18)'}})}},
  {k:'bc_freeze',n:'こおらせる',d:'カチコチ（1回休み）',stage:S1,total:2600,build(){const t=U(0);F.shot(pos(U(2)),pos(t),{t:300,d:300,im:'x_ice',sz:30,trail:'160,220,255'});F.at(600,tt=>{const p=pos(t);F.flash({t:tt,d:200,col:'200,240,255',a:.6});F.burst(p.x,p.y,{t:tt,n:14,im:'x_ice',sp:5,g:.15,life:700,sz:.2})});
   F.overlay(t,{t:600,d:2000,draw:(x,y,r,e)=>{const c=F.ctx();const k=Math.min(1,e/250);c.save();c.globalAlpha=.75*k;c.fillStyle='rgba(170,225,255,.55)';c.beginPath();for(let i=0;i<8;i++){const a=i/8*Math.PI*2;const rr=(i%2?r*1.05:r*1.3)*k;c.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}c.closePath();c.fill();c.strokeStyle='rgba(255,255,255,.9)';c.lineWidth=2;c.stroke();c.restore()}})}},
  {k:'bc_poison',n:'毒を つける',d:'毎ターン 1ダメージ',stage:S1,total:2600,build(){const t=U(0);F.shot(pos(U(2)),pos(t),{t:300,d:380,im:'x_poison',sz:30,arc:60,trail:'170,90,230'});F.at(680,tt=>{const p=pos(t);F.burst(p.x,p.y,{t:tt,n:12,im:'x_poison',sp:3,g:.12,life:900,sz:.2,add_:false});F.floatTxt('毒×2',p.x,p.y-26,{t:tt,col:'#d9a0ff'})});
   F.overlay(t,{t:680,d:1900,draw:(x,y,r,e)=>{const c=F.ctx();c.fillStyle='rgba(150,70,210,.5)';for(let i=0;i<4;i++){const k=((e/700)+i/4)%1;c.beginPath();c.arc(x-r*.5+i*r*.35,y+r*.2+k*r*.9,3+2*(1-k),0,7);c.fill()}}});F.keyf(t,{t:680,d:1900,fn:u=>{u.tint='rgba(140,60,200,.22)'}})}},
  {k:'bc_blow',n:'ふきとばす',d:'あいてを 手札に もどす',stage:S1,total:2400,build(){const t=U(0);F.at(300,tt=>{const p=pos(t);F.icon('x_tornado',p.x,p.y+10,{t:tt,d:900,sz:110,bob:3})});F.keyf(t,{t:500,d:600,fn:(u,k)=>{u.rot=k*12;u.oy=-k*260;u.sc=1-k*.6;u.alpha=1-k}});F.at(500,tt=>F.smoke(pos(t).x,pos(t).y+20,{t:tt}))}},
  {k:'bc_draw',n:'カードを ひく',d:'山札から 手札へ',stage:{foes:S1.foes,mine:[{art:'dog'}]},total:2200,build(){const {W,H}=F.dims();const from={x:W*.9,y:H*.75},to={x:W*.5,y:H*.97};for(let i=0;i<2;i++){F.shot(from,to,{t:300+i*260,d:420,im:'x_card',sz:46,arc:120,trail:'255,240,190'});F.at(720+i*260,tt=>F.burst(to.x,to.y-20,{t:tt,n:6,im:'x_spark',sp:3,life:500,sz:.18}))}}},
  {k:'bc_summon',n:'なかまを よぶ',d:'あいている 場所に 出てくる',stage:{foes:S1.foes,mine:[{art:'zombie',atk:1,hp:1},{art:'zombie',atk:1,hp:1,hidden:true}]},total:2400,build(){const z=U(3);F.at(300,tt=>{const p=pos(z);F.ring(p.x,p.y,{t:tt,col:'170,255,170',r1:60});F.smoke(p.x,p.y+20,{t:tt,col:'150,200,150'});z.hidden=false;z.sc=0});F.tween(z,{t:300,d:420,sc:1,e:E.b})}},
 ]},
 {cat:'キーワード',items:[
  {k:'kw_taunt',n:'かばう',d:'あいては まず この子を ねらう',stage:{foes:S1.foes,mine:[{art:'armadillo',atk:1,hp:3},{art:'dog'}]},total:2400,build(){const u=U(2);F.at(300,tt=>{const p=pos(u);F.icon('u_k_taunt',p.x,p.y-u.r-24,{t:tt,d:1600,sz:56,bob:3});F.ring(p.x,p.y,{t:tt,col:'190,200,220',r1:80,w:10})});F.keyf(u,{t:300,d:1800,fn:(u,k)=>{u.glow=.8;u.glowC='190,210,240'}})}},
  {k:'kw_shield',n:'バリア',d:'1回だけ ダメージ0',stage:{foes:S1.foes,mine:[{art:'jacka',atk:1,hp:1}]},total:2800,build(){const u=U(2);F.overlay(u,{t:200,d:1100,draw:(x,y,r,e,k)=>{const c=F.ctx();const g=c.createRadialGradient(x-r*.3,y-r*.3,r*.2,x,y,r*1.35);g.addColorStop(0,'rgba(255,255,255,.35)');g.addColorStop(.8,'rgba(120,200,255,.35)');g.addColorStop(1,'rgba(120,200,255,.0)');c.fillStyle=g;c.beginPath();c.arc(x,y,r*1.35,0,7);c.fill();c.strokeStyle='rgba(180,230,255,.9)';c.lineWidth=2;c.stroke()}});
   F.shot(pos(U(0)),pos(u),{t:700,d:260,im:'x_bullet',sz:22});F.at(960,tt=>{const p=pos(u);F.burst(p.x,p.y,{t:tt,n:16,im:'x_barrier',sp:6,g:.15,life:700,sz:.2});F.flash({t:tt,d:160,col:'180,230,255',a:.5});F.floatTxt('0',p.x,p.y-26,{t:tt,col:'#bfe6ff',size:28})})}},
  {k:'kw_quick',n:'はやうち',d:'出した ターンから すぐ 攻撃',stage:{foes:S1.foes,mine:[{art:'bibiri',atk:4,hp:3}]},total:2200,build(){const u=U(2);F.at(250,tt=>{const p=pos(u);F.icon('u_k_quick',p.x,p.y-u.r-22,{t:tt,d:1200,sz:56});F.burst(p.x,p.y,{t:tt,n:10,im:'x_bolt',sp:6,g:0,life:500,sz:.25});F.flash({t:tt,d:120,col:'255,240,120',a:.5})});F.keyf(u,{t:250,d:1200,fn:(u,k)=>{u.glow=1-k;u.glowC='255,230,80'}})}},
  {k:'kw_twice',n:'2回攻撃',d:'1ターンに 2回',stage:S1,total:2600,build(){const a=U(2),t=U(0);const pa=pos(a),pt=pos(t);[0,1].forEach(i=>{const s=300+i*650;F.keyf(a,{t:s,d:180,fn:(u,k)=>{u.ox=(pt.x-pa.x)*E.io(k);u.oy=(pt.y-pa.y)*E.io(k)}});F.at(s+180,tt=>{F.burst(pt.x,pt.y,{t:tt,n:8,im:'x_slash',sp:5,life:400,sz:.3});F.floatTxt(i?'2回目！':'1回目',pt.x,pt.y-36,{t:tt,size:18,col:'#ffd27a'})});hitAt(t,s+180,1);F.keyf(a,{t:s+190,d:300,fn:(u,k)=>{u.ox=(pt.x-pa.x)*(1-E.o(k));u.oy=(pt.y-pa.y)*(1-E.o(k))}})})}},
  {k:'kw_stealth',n:'かくれんぼ',d:'自分から 攻撃するまで ねらわれない',stage:{foes:S1.foes,mine:[{art:'new03',atk:4,hp:1}]},total:2400,build(){const u=U(2);F.keyf(u,{t:300,d:600,fn:(u,k)=>{u.alpha=1-k*.6}});F.keyf(u,{t:900,d:1300,fn:(u,k,tt)=>{u.alpha=.4+.1*Math.sin(tt/150);u.ox=Math.sin(tt/300)*3}});F.at(300,tt=>F.smoke(pos(u).x,pos(u).y+10,{t:tt,col:'200,200,220',n:10}))}},
  {k:'kw_thorns',n:'トゲ',d:'攻撃してきた あいてに ダメージ',stage:{foes:[{art:'jab'}],mine:[{art:'sabota',atk:1,hp:3}]},total:2400,build(){const a=U(0),t=U(1);const pa=pos(a),pt=pos(t);F.keyf(a,{t:300,d:200,fn:(u,k)=>{u.ox=(pt.x-pa.x)*E.io(k)*.85;u.oy=(pt.y-pa.y)*E.io(k)*.85}});hitAt(t,500,2);F.at(520,tt=>{F.burst(pt.x,pt.y-10,{t:tt,n:12,im:'x_claw',sp:6,dir:-Math.PI/2,spread:1.6,life:500,sz:.22})});hitAt(a,600,1,{im:'x_claw'});F.keyf(a,{t:520,d:400,fn:(u,k)=>{u.ox=(pt.x-pa.x)*.85*(1-E.o(k));u.oy=(pt.y-pa.y)*.85*(1-E.o(k))}})}},
  {k:'kw_revive',n:'1回復活',d:'たおれても 1回だけ 立ち上がる',stage:{foes:S1.foes,mine:[{art:'zombie',atk:1,hp:1}]},total:3000,build(){const u=U(2);F.keyf(u,{t:300,d:500,fn:(u,k)=>{u.gray=k;u.rot=k*.3}});F.at(900,tt=>{const p=pos(u);F.icon('x_halo',p.x,p.y-u.r-10,{t:tt,d:900,sz:60});F.dots(p.x,p.y+30,{t:tt,n:30,col:'255,240,200',up:3,life:900})});F.keyf(u,{t:1100,d:500,fn:(u,k)=>{u.gray=1-k;u.rot=.3*(1-k);u.glow=k}});F.at(1600,tt=>{F.floatTxt('ふっかつ！',pos(u).x,pos(u).y-30,{t:tt,col:'#ffe9a0'});u.hp=1})}},
  {k:'kw_deadly',n:'必殺',d:'戦った あいてを 一発で',stage:{foes:[{art:'eagle',atk:6,hp:7}],mine:[{art:'kurogoke',atk:2,hp:2}]},total:2600,build(){const a=U(1),t=U(0);const pa=pos(a),pt=pos(t);F.darken({t:200,d:1600,a:.55});F.keyf(a,{t:500,d:150,fn:(u,k)=>{u.ox=(pt.x-pa.x)*E.io(k);u.oy=(pt.y-pa.y)*E.io(k)}});F.at(650,tt=>{F.flash({t:tt,d:250,col:'255,255,255',a:.9});F.icon('x_skull',pt.x,pt.y,{t:tt,d:700,sz:90});F.burst(pt.x,pt.y,{t:tt,n:14,im:'x_slash',sp:7,life:500,sz:.3})});F.keyf(a,{t:660,d:300,fn:(u,k)=>{u.ox=(pt.x-pa.x)*(1-E.o(k));u.oy=(pt.y-pa.y)*(1-E.o(k))}});ko(t,900)}},
 ]},
 {cat:'じょうたい',items:[
  {k:'st_sleep',n:'ねむい（じゅんび中）',d:'出した ターンは うごけない',stage:{foes:S1.foes,mine:[{art:'new54',atk:1,hp:4}]},total:2600,build(){const u=U(2);F.overlay(u,{t:200,d:2300,draw:(x,y,r,e)=>{const c=F.ctx();const I=F.ui('x_zzz');if(!I.complete)return;for(let i=0;i<3;i++){const k=((e/1200)+i/3)%1;c.save();c.globalAlpha=Math.sin(k*Math.PI);c.drawImage(I,x+r*.4+k*16,y-r-k*36,18+k*10,18+k*10);c.restore()}}});F.keyf(u,{t:200,d:2300,fn:(u,k,tt)=>{u.rot=Math.sin(tt/600)*.08}})}},
  {k:'st_jail',n:'牢屋（休眠）',d:'何も できない・当たらない',stage:S1,total:3200,build(){const t=U(0);F.at(300,tt=>{const p=pos(t);F.flash({t:tt,d:150,a:.4})});F.overlay(t,{t:300,d:2800,draw:(x,y,r,e)=>{const c=F.ctx();const k=Math.min(1,e/300);const drop=(1-E.b(k))*-60;c.save();c.translate(0,drop);c.fillStyle='rgba(30,20,10,.45)';c.beginPath();c.arc(x,y,r+4,0,7);c.fill();c.strokeStyle='#5a4028';c.lineWidth=5;for(let i=-2;i<=2;i++){c.beginPath();c.moveTo(x+i*r*.42,y-r-6);c.lineTo(x+i*r*.42,y+r+6);c.stroke()}c.strokeStyle='#c9a46a';c.lineWidth=2;for(let i=-2;i<=2;i++){c.beginPath();c.moveTo(x+i*r*.42-1,y-r-6);c.lineTo(x+i*r*.42-1,y+r+6);c.stroke()}c.fillStyle='#3a2a1a';c.fillRect(x-r-6,y-r-10,r*2+12,8);c.fillRect(x-r-6,y+r+2,r*2+12,8);c.restore()}});F.keyf(t,{t:300,d:2800,fn:(u,k)=>{u.gray=Math.min(1,k*4)*.8}});F.at(700,tt=>F.floatTxt('牢屋 あと 2',pos(t).x,pos(t).y-t.r-26,{t:tt,d:2000,rise:0,size:16}))}},
  {k:'st_burn',n:'やけど',d:'毎ターン 1ダメージ（あつあつ）',stage:S1,total:2400,build(){const t=U(0);F.overlay(t,{t:200,d:2000,draw:(x,y,r,e)=>{const c=F.ctx();c.save();c.globalCompositeOperation='lighter';for(let i=0;i<6;i++){const k=((e/500)+i/6)%1;const I=F.ui('x_fire');if(I.complete){const s=16+8*(1-k);c.globalAlpha=1-k;c.drawImage(I,x-r*.7+i*r*.28-s/2,y+r*.4-k*r*1.4-s/2,s,s)}}c.restore()}});hitAt(t,1000,1,{im:'x_fire'})}},
 ]},
 {cat:'これから 作る',items:[
  {k:'s1',n:'キャラ専用 演出',d:'122人ぶん',soon:1},{k:'s2',n:'ボス登場',d:'',soon:1},{k:'s3',n:'勝った！／まけた',d:'',soon:1},{k:'s4',n:'合成・しんか・かくせい',d:'',soon:1},{k:'s5',n:'天気（はれ・あめ・ゆき・すな）',d:'',soon:1},{k:'s6',n:'お金・カードを 手に入れる',d:'',soon:1}]},
];
const ALL=LIST.flatMap(c=>c.items.filter(i=>!i.soon));
const menu=document.getElementById('menu');
menu.innerHTML=LIST.map(c=>`<div class="cat">${c.cat}<i>${c.items.filter(i=>!i.soon).length?c.items.filter(i=>!i.soon).length+'こ':'じゅんび中'}</i></div><div class="grid">${c.items.map(i=>`<button class="it ${i.soon?'soon':''}" data-k="${i.k}"><b>${i.n}</b><small>${i.d||'じゅんび中'}</small></button>`).join('')}</div>`).join('')
 +`<div class="cat" style="margin-top:16px">くらべる</div><div class="grid"><a class="it" href="kenzan.html" style="text-decoration:none"><b>見参！ いま↔新しい</b><small>前に 作った くらべページ</small></a></div>`;
const pl=document.getElementById('player');let cur=0;
F.init(document.getElementById('cv'));
function open(i){cur=(i+ALL.length)%ALL.length;const it=ALL[cur];document.getElementById('pt').textContent=it.n;document.getElementById('pd').textContent=it.d;pl.classList.add('on');try{location.hash=it.k}catch(e){}setTimeout(()=>{F.init(document.getElementById('cv'));F.play(it,it.total||2600)},60)}
menu.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>open(ALL.findIndex(x=>x.k===b.dataset.k)));
document.getElementById('back').onclick=()=>{pl.classList.remove('on');try{history.replaceState(null,'',location.pathname)}catch(e){}};
document.getElementById('again').onclick=()=>open(cur);document.getElementById('prev').onclick=()=>open(cur-1);document.getElementById('next').onclick=()=>open(cur+1);
const h=location.hash.slice(1);if(h){const i=ALL.findIndex(x=>x.k===h);if(i>=0)open(i)}
</script>
