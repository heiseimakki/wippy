<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>キャンバス演出 ずかん</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;800;900&display=swap">
<style>
:root{--ink:#3a2412;--gold:#ffcd3c;--panel:rgba(40,20,8,.88)}
*{box-sizing:border-box;touch-action:manipulation}
html,body{margin:0;height:100%;background:#1d1108;color:#fff;font-family:"M PLUS Rounded 1c",sans-serif;overflow:hidden}
#wrap{position:relative;max-width:430px;height:100%;margin:0 auto;display:flex;flex-direction:column}
header{padding:12px 14px 6px;text-align:center}
header b{font-family:"Dela Gothic One";font-size:21px;color:var(--gold);letter-spacing:.04em}
header p{margin:3px 0 0;font-size:12px;color:#e8d3b0}
#menu{flex:1;overflow:auto;padding:4px 12px 20px}
.cat{margin:10px 0 4px;font-weight:900;font-size:14px;color:#ffe9b0;display:flex;align-items:center;gap:6px}
.cat i{font-style:normal;font-size:11px;color:#c9b08a;font-weight:800}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.it{background:var(--panel);border:2px solid #6b4a2a;border-radius:12px;padding:8px 10px;text-align:left;color:#fff;font:inherit;cursor:pointer}
.it b{display:block;font-size:14px;font-weight:900}
.it small{display:block;font-size:10.5px;color:#d9c4a0;line-height:1.35;margin-top:2px}
.it.new{border-color:#ffcd3c;box-shadow:0 0 10px rgba(255,205,60,.4)}
.it.soon{opacity:.45;pointer-events:none}
#player{position:absolute;inset:0;display:none;flex-direction:column;background:#1d1108}
#player.on{display:flex}
.ptop{display:flex;align-items:center;gap:8px;padding:10px 12px 4px}
.ptop button{font:900 14px inherit;border:2px solid #a07a4a;background:rgba(255,255,255,.08);color:#ffe9b0;border-radius:10px;padding:6px 12px}
.ptop .ttl{flex:1;text-align:center}
.ptop .ttl b{display:block;font-family:"Dela Gothic One";font-size:15px;color:var(--gold)}
.ptop .ttl small{font-size:11px;color:#d9c4a0}
#stage{position:absolute;inset:0;overflow:hidden;background:#000}
#stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
#player .ptop,#player .pbot{position:absolute;left:0;right:0;z-index:5}
#player .ptop{bottom:0;padding:0 8px calc(10px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:6px;pointer-events:none}
#player .ptop>*{pointer-events:auto}
#player .ptop .ttl{background:rgba(30,15,5,.82);border-radius:12px;padding:4px 8px;min-width:0}
#player .ptop .ttl small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#player .ptop button{background:rgba(30,15,5,.85)}
#player .pbot{display:none}
.mini{display:flex;gap:4px}.mini button{font:900 13px inherit;border:2px solid #a07a4a;background:rgba(30,15,5,.85);color:#ffe9b0;border-radius:10px;padding:6px 9px}
.mini #again{background:linear-gradient(#7be08a,#2fa84a);color:#fff;border-color:#1d6e30}
.pbot{display:flex;gap:8px;padding:6px 12px calc(12px + env(safe-area-inset-bottom))}
.pbot button{flex:1;font:900 15px inherit;padding:13px 0;border:0;border-radius:999px;color:#fff}
#again{flex:2;background:linear-gradient(#7be08a,#2fa84a);box-shadow:0 4px 0 #1d6e30}
#prev,#next{background:#5a3a22;box-shadow:0 4px 0 #2a180c}
</style></head><body>
<div id="wrap">
  <header><b>キャンバス演出 ずかん</b><p>本番と おなじ バトル画面で 新しい 演出を 見られるよ（ゲームには まだ 入っていません）</p></header>
  <div id="menu"></div>
  <div id="player">
    <div id="stage"><iframe id="bf" src="board.html"></iframe><canvas id="cv"></canvas></div>
    <div class="ptop"><button id="back">← もくじ</button><div class="ttl"><b id="pt"></b><small id="pd"></small></div><div class="mini"><button id="prev">◀</button><button id="again">もう一度</button><button id="next">▶</button></div></div>
  </div>
</div>
<script src="fx.js"></script>
<script>
const F=FX,{P,E}=F;
const U=i=>F.units()[i];
const pos=u=>F.P(u);
/* 文字を 出す 高さ：あいての 場と じぶんの 場の あいだ */
const MID=()=>{const e=F.place(F.bd().units[0].parentNode),a=F.place(document.getElementById('bf').contentDocument.getElementById('af'));return (e.y+e.h/2+a.y-a.h/2)/2};
const hero=s=>F.P(F.heroes()[s]);
/* よく つかう 場面 */
const S1={foes:[{art:'jab',atk:2,hp:3},{art:'iguana',atk:2,hp:2}],mine:[{art:'dog',atk:2,hp:3},{art:'juko',atk:2,hp:4}]};
const S2={foes:[{art:'jab',atk:2,hp:3},{art:'iguana',atk:2,hp:2},{art:'kurogoke',atk:2,hp:2}],mine:[{art:'dog',atk:2,hp:3}]};
/* 出てくる 動き（共通） */
function enter(u,t=200,from){const {H}=F.dims();if(from==null){const hd=F.place(F.bd().hand);from=hd.y/H}const y0=u.y;u.y=from;u.rot=-.4;u.sc=.6;
  F.tween(u,{t,d:380,y:y0,rot:0,sc:1.35});F.tween(u,{t:t+380,d:110,sc:1,e:E.io});
  F.at(t+490,()=>{const p=pos(u);F.ring(p.x,p.y,{t:t+490,r1:110});F.ring(p.x,p.y,{t:t+620,col:'255,255,255',w:5,r1:150,d:800});F.smoke(p.x,p.y+u.r,{t:t+490});F.shake({t:t+490,p:6})});
  return t+490}
function hitAt(u,t,n,o={}){F.at(t,()=>{const p=pos(u);F.burst(p.x,p.y,{t,n:o.n||8,im:o.im||'x_hit',sp:5,g:.1,life:500,sz:.3});F.floatTxt('-'+n,p.x,p.y-20,{t,col:'#ffdddd',size:26});F.keyf(u,{t,d:300,fn:(u,k)=>{u.ox=(Math.random()-.5)*10*(1-k);u.tint=`rgba(255,40,40,${.45*(1-k)})`}});F.keyf(u,{t:t+300,d:20,fn:u=>{u.ox=0;u.tint=null}});u.hp=Math.max(0,u.hp-n)})}
function ko(u,t){F.keyf(u,{t,d:500,fn:(u,k)=>{u.gray=k;u.ox=(Math.random()-.5)*8;u.rot=k*.3}});F.tween(u,{t:t+500,d:280,sc:.2,alpha:0,e:E.io});F.at(t+560,()=>{const p=pos(u);F.smoke(p.x,p.y,{t:t+560,n:14,col:'230,220,210',spread:70,r:18});F.burst(p.x,p.y,{t:t+560,n:6,im:'x_star',sp:4,g:.05,life:800,sz:.2})});return t+780}
const u0=r=>r*1.25+6;
function freezeOn(u,t){F.at(t,()=>{const el=u.el,d=el.ownerDocument;el.classList.add('iced');const o=d.createElement('div');o.className='iceov';el.appendChild(o);
  o.animate([{clipPath:'inset(100% 0 0 0)'},{clipPath:'inset(0 0 0 0)'}],{duration:450,easing:'cubic-bezier(.2,.8,.3,1)',fill:'both'});
  const p=pos(u);F.floatTxt('カチコチ！',p.x,p.y-u.rh/2-10,{t,col:'#bff4ff',size:20})})}
const LIST=[
 {cat:'きほん',items:[
  {k:'kenzan',n:'見参！',d:'カードを 出した しゅんかん',stage:{foes:S1.foes,mine:[{art:'dog'},{art:'eagle',atk:6,hp:7}]},total:3400,build(){const u=U(3);F.darken({t:150,d:4700});const t=enter(u);
   F.at(t,()=>F.rays(pos(u).x,pos(u).y,{t,d:4200}));F.at(t,()=>{const p=pos(u);F.burst(p.x,p.y,{t,n:24,im:['x_spark','x_star'],sp:7,sz:.25});F.flash({t,d:240,a:.85})});
   F.slam('見参！',F.dims().W/2,MID()-6,{t:t+120,d:2200,sub:'空から 見まもっておる！'});F.keyf(u,{t,d:4000,fn:(u,k)=>{u.glow=Math.sin(k*Math.PI)}})}},
  {k:'yarare',n:'やられたら',d:'たおれた ときに 出る 効果',stage:{foes:S1.foes,mine:[{art:'new03',atk:4,hp:1},{art:'juko'}]},total:4600,build(){const u=U(2);ko(u,300);const p0=pos(u);
   F.at(1150,()=>{F.icon('u_k_dr',p0.x,p0.y,{t:1150,d:1300,sz:70,bob:4});F.ring(p0.x,p0.y,{t:1150,col:'170,120,255',r1:90})});
   F.slam('やられたら',F.dims().W/2,MID()-6,{t:1350,d:1500,size:42,grad:['#f0e0ff','#c99aff','#8a5ad0','#5a2aa0'],stroke:'#1e0a3a',sub:'のろいの 手紙が とんでいく…'});
   F.at(2050,()=>{const tg=pos(U(0));F.shot(p0,tg,{t:2050,d:750,im:'x_card',sz:34,arc:90,trail:'190,140,255',onHit:tt=>{}})});hitAt(U(0),2800,1,{im:'x_skull'})}},
  {k:'irua',n:'いるあいだ',d:'出した時と 毎ターンの はじめに 力を くばる',stage:{foes:S1.foes,mine:[{art:'dog'},{art:'juko',kw:['taunt']},{art:'jacka'}]},total:6400,build(){const u=U(4);const {W,H}=F.dims();const t0=enter(u);
   const pulse=(t,lab)=>{F.at(t,tt=>{const p=pos(u);F.ring(p.x,p.y,{t:tt,col:'255,215,90',r1:W*.45,w:8,d:900});F.ring(p.x,p.y,{t:tt+180,col:'255,255,255',r1:W*.35,w:4,d:800});F.dots(p.x,p.y,{t:tt,n:20,col:'255,220,120',area:80,up:2});
     [2,3].forEach((i,j)=>{const v=U(i),q=pos(v);F.shot(p,q,{t:tt+120+j*80,d:320,im:'x_star',sz:22,trail:'255,215,90'});F.at(tt+440+j*80,t2=>{F.burst(q.x,q.y,{t:t2,n:6,im:'x_star',sp:3,g:-.05,life:900,sz:.18});F.keyf(v,{t:t2,d:700,fn:(v,k)=>{v.glow=Math.sin(k*Math.PI);v.sc=1+.12*Math.sin(k*Math.PI)}});if(lab){F.floatTxt(lab,q.x,q.y-q.y*0-40,{t:t2,col:'#ffe066',size:18});v.atk+=1;v.up=1;v.marks=['x_star']}})})});
     F.keyf(u,{t,d:900,fn:(u,k)=>{u.glow=Math.sin(k*Math.PI);u.glowC='255,215,90'}})};
   pulse(t0+200,'攻撃+1');
   F.slam('ターンの はじめ',W/2,MID()-6,{t:t0+1600,d:1400,size:30,from:1.6});pulse(t0+3100,null)}},
  {k:'attack',n:'こうげき',d:'なかまが あいてに ぶつかる',stage:S1,total:2400,build(){const a=U(2),t=U(0);const pa=pos(a),pt=pos(t);
   F.tween(a,{t:250,d:160,oy:20,sc:1.1});F.keyf(a,{t:410,d:180,fn:(u,k)=>{u.ox=(pt.x-pa.x)*E.io(k);u.oy=20+(pt.y-pa.y-20)*E.io(k)}});
   F.at(590,()=>{F.flash({t:590,d:120,a:.5});F.shake({t:590,p:9,d:300});F.burst(pt.x,pt.y,{t:590,n:10,im:'x_pow',sp:6,g:.1,life:500,sz:.35});F.icon('x_pow',pt.x,pt.y,{t:590,d:350,sz:90})});hitAt(t,590,2);
   F.keyf(a,{t:600,d:380,fn:(u,k)=>{u.ox=(pt.x-pa.x)*(1-E.o(k));u.oy=(pt.y-pa.y)*(1-E.o(k));u.sc=1.1-.1*k}});F.at(1000,()=>{a.ox=0;a.oy=0})}},
  {k:'ko',n:'やられ（たおれる）',d:'体力が 0に なったとき',stage:S1,total:2000,build(){hitAt(U(1),300,2);ko(U(1),700)}},
  {k:'hero',n:'親分に ダメージ',d:'あいての 親分に とどいた！',stage:{foes:[],mine:[{art:'dog'},{art:'eagle',atk:6}]},total:2200,build(){const a=U(1),h=F.heroes().foe;const pa=pos(a),ph=hero('foe');
   F.keyf(a,{t:300,d:220,fn:(u,k)=>{u.ox=(ph.x-pa.x)*E.io(k);u.oy=(ph.y-pa.y)*E.io(k)}});F.at(520,()=>{F.flash({t:520,d:180,col:'255,60,60',a:.35});F.shake({t:520,p:12});F.burst(ph.x,ph.y,{t:520,n:14,im:['x_pow','x_star'],sp:7,life:700});F.floatTxt('-6',ph.x,ph.y+10,{t:520,size:34,col:'#ffd0d0'});h.hp-=6});
   F.keyf(a,{t:530,d:400,fn:(u,k)=>{u.ox=(ph.x-pa.x)*(1-E.o(k));u.oy=(ph.y-pa.y)*(1-E.o(k))}});F.keyf(h,{t:520,d:500,fn:(u,k)=>{u.ox=(Math.random()-.5)*14*(1-k)}})}},
 ]},
 {cat:'見参の 効果',items:[
  {k:'bc_dmg',n:'ダメージ',d:'ねらって うつ（アニー など）',stage:{foes:S1.foes,mine:[{art:'annie',atk:2,hp:1}]},total:2400,build(){const a=U(2),t=U(0);F.at(300,()=>{F.icon('x_muzzle',pos(a).x,pos(a).y-30,{t:300,d:200,sz:50})});F.shot(pos(a),pos(t),{t:320,d:380,im:'x_bullet',sz:24});F.at(700,()=>F.shake({t:700,p:6}));hitAt(t,700,2)}},
  {k:'bc_aoe',n:'ぜんたい ダメージ',d:'あいて ぜんいんに',stage:S2,total:2600,build(){const {W,H}=F.dims();F.darken({t:100,d:2200,a:.35});F.at(300,()=>{F.ring(W/2,H*.36,{t:300,r1:W*.7,w:14,col:'255,140,60',d:700});F.shake({t:300,p:10,d:500});F.flash({t:300,d:200,col:'255,180,90',a:.6})});[0,1,2].forEach(i=>hitAt(U(i),380+i*60,1,{im:'x_fire'}))}},
  {k:'bc_heal',n:'かいふく',d:'なかまの 体力を いやす',stage:{foes:S1.foes,mine:[{art:'dog',hp:1},{art:'juko',hp:2},{art:'sabota'}]},total:2400,build(){[2,3].forEach((i,j)=>{F.at(300+j*120,tt=>{const p=pos(U(i));F.dots(p.x,p.y+20,{t:tt,n:22,col:'140,255,160',up:2.2,life:1100,area:70});F.burst(p.x,p.y,{t:tt,n:6,im:'x_heal',sp:2,g:-.1,life:1000,sz:.22});F.floatTxt('+2',p.x,p.y-24,{t:tt+150,col:'#9dffb0'});U(i).hp+=2;F.keyf(U(i),{t:tt,d:800,fn:(u,k)=>{u.glow=Math.sin(k*Math.PI);u.glowC='140,255,160'}})})})}},
  {k:'bc_buff',n:'パワーアップ',d:'なかまが 強くなる（+2/+2）',stage:{foes:S1.foes,mine:[{art:'dog'},{art:'juko'}]},total:2400,build(){const u=U(2);F.at(300,tt=>{const p=pos(u);F.ring(p.x,p.y,{t:tt,r1:70,col:'255,215,90',d:500});F.ring(p.x,p.y,{t:tt+200,r1:90,col:'255,255,255',w:4,d:600});F.dots(p.x,p.y+30,{t:tt,n:26,up:3,col:'255,220,120',life:900,area:60});F.floatTxt('+2/+2',p.x,p.y-30,{t:tt+200,col:'#ffe066',size:26});u.atk+=2;u.hp+=2});F.tween(u,{t:300,d:200,sc:1.25});F.tween(u,{t:500,d:300,sc:1,e:E.b});F.keyf(u,{t:300,d:1200,fn:(u,k)=>{u.glow=Math.sin(k*Math.PI)}})}},
  {k:'bc_stun',n:'酔わせる',d:'1回休み（カンカン など）',stage:S1,total:3400,build(){const t=U(0);F.shot(pos(U(2)),pos(t),{t:300,d:850,im:'x_bottle',sz:34,arc:70,spin:1});F.at(1150,tt=>{const p=pos(t);F.burst(p.x,p.y,{t:tt,n:10,im:'x_splash',sp:4,life:600,sz:.25,add_:false})});
   F.overlay(t,{t:1150,d:1800,draw:(x,y,r,e)=>{const c=F.ctx();for(let i=0;i<3;i++){const a=e/400+i*2.1;const I=F.ui('x_dizzy');if(I.complete){c.drawImage(I,x+Math.cos(a)*r*.9-16,y-u0(r)+Math.sin(a)*6-16,32,32)}}}});F.keyf(t,{t:1150,d:1800,fn:(u,k)=>{u.rot=Math.sin(k*20)*.15;u.tint='rgba(255,120,170,.18)'}})}},
  {k:'bc_freeze',n:'こおらせる',d:'カチコチ（1回休み）',stage:S1,total:3400,build(){const t=U(0);F.shot(pos(U(2)),pos(t),{t:300,d:750,im:'x_ice',sz:30,trail:'160,220,255'});F.at(1050,tt=>{const p=pos(t);freezeOn(t,tt);F.flash({t:tt,d:200,col:'200,240,255',a:.6});F.burst(p.x,p.y,{t:tt,n:14,im:'x_ice',sp:5,g:.15,life:700,sz:.2})});}},
  {k:'bc_poison',n:'毒を つける',d:'毎ターン 1ダメージ',stage:S1,total:3400,build(){const t=U(0);F.shot(pos(U(2)),pos(t),{t:300,d:800,im:'x_poison',sz:30,arc:60,trail:'170,90,230'});F.at(1100,tt=>{const p=pos(t);F.burst(p.x,p.y,{t:tt,n:12,im:'x_poison',sp:3,g:.12,life:900,sz:.2,add_:false});F.floatTxt('毒×2',p.x,p.y-26,{t:tt,col:'#d9a0ff'})});
   F.overlay(t,{t:1100,d:1900,draw:(x,y,r,e)=>{const c=F.ctx();c.fillStyle='rgba(150,70,210,.5)';for(let i=0;i<4;i++){const k=((e/700)+i/4)%1;c.beginPath();c.arc(x-r*.5+i*r*.35,y+r*.2+k*r*.9,5+3*(1-k),0,7);c.fill()}}});F.keyf(t,{t:1100,d:1900,fn:u=>{u.tint='rgba(140,60,200,.22)'}})}},
  {k:'bc_blow',n:'ふきとばす',d:'たつまきが 通りすぎて あいてを 手札へ',stage:S1,total:3600,build(){const t=U(0);const {W}=F.dims();const fh=F.place(F.bd().foeHand);
   const T0=200,D=2600,base=pos(t).y+t.rh*.6,x0=-90,x1=W+90;const tw=F.tornadoImg({t:T0,d:D,y:base,x0,x1,h:t.rh*2.6});
   /* たつまきが 来た 時に まきこまれる */const hitAt=T0+D*((t.bx-x0)/(x1-x0))-180;
   F.at(hitAt,tt=>F.smoke(pos(t).x,base,{t:tt,n:12,spread:100}));
   F.keyf(t,{t:hitAt,d:900,fn:(u,k,tt)=>{const a=tt/150;u.ox=(tw.x-u.bx)*Math.min(1,k*3)+Math.cos(a)*u.rw*.5*k;u.oy=-k*u.rh*1.2+Math.sin(a)*8;u.rot=Math.sin(tt/120)*.5;u.sc=1-k*.2}});
   let sx=0,sy=0;F.keyf(t,{t:hitAt+900,d:700,fn:(u,k)=>{if(!sx){sx=u.ox;sy=u.oy}u.ox=sx+(fh.x-u.bx-sx)*E.io(k);u.oy=sy+(fh.y-u.by-sy)*E.io(k);u.sc=.8-.6*k;u.rot=.5+k*2;u.alpha=1-k*.6}});
   F.at(hitAt+1600,tt=>{t.hidden=true;const f=F.bd().foeHand,d=f.ownerDocument;const cb=d.createElement('span');cb.className='cb';f.appendChild(cb);cb.animate([{transform:'scale(1.8)',filter:'brightness(2)'},{transform:'scale(1)',filter:'none'}],{duration:400,easing:'ease-out'});F.floatTxt('手札に もどった',fh.x,fh.y+30,{t:tt,size:15})})}},
  {k:'bc_draw',n:'カードを ひく',d:'山札から 手札へ',stage:{foes:S1.foes,mine:[{art:'dog'}]},total:3200,build(){const B=F.bd();while(B.hand.children.length>2)B.hand.lastElementChild.remove();const pl=F.place(B.pile);
   const ids=[['eagle','シェリフ・モーキン警部',5,6,7],['juko','重厚な保安官',3,2,4]];
   ids.forEach((c0,i)=>F.at(400+i*700,tt=>{const hand=B.hand,d=hand.ownerDocument;const src=hand.children[0];const el=src.cloneNode(true);el.classList.remove('can');el.querySelectorAll('.stack,.kws i').forEach(x=>x.remove());
     const art=el.querySelector('.art');art.style.backgroundImage=`url(img/${c0[0]}.webp)`;el.querySelector('.nm').textContent=c0[1];el.querySelector('.stat.cost').textContent=c0[2];el.querySelector('.stat.a').textContent=c0[3];el.querySelector('.stat.h').textContent=c0[4];
