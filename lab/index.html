function drunkOn(a,t,T){F.shot(pos(a),pos(t),{t:T,d:650,im:'fx:new/whisky',sz:34,scale:1.45,arc:70,trail:'230,160,70'});
 F.at(T+650,tt=>{const p=pos(t);F.burst(p.x,p.y,{t:tt,n:12,im:['fx:new/amber_drops','fx:new/amber_splash'],sp:4.5,g:.2,life:520,sz:.24,add_:false});ono(t,'ヒック！',tt+100,{col:'#ffd08a'})});
 F.overlay(t,{t:T+650,d:1700,draw:(x,y,r,e)=>{const c=F.ctx(),I=F.ui('x_dizzy');if(!I.complete)return;for(let i=0;i<3;i++){const a2=e/400+i*2.1;c.drawImage(I,x+Math.cos(a2)*t.rw*.45-14,y-t.rh*.62+Math.sin(a2)*5-14,28,28)}}});
 F.keyf(t,{t:T+650,d:1700,fn:(v,k)=>{v.rot=k>=1?0:Math.sin(k*20)*.15;v.tint=k>=1?null:'rgba(230,150,60,.16)'}});return T+650}
function healOn(u,t,n){F.at(t,tt=>{const p=pos(u);F.dots(p.x,p.y+u.rh*.3,{t:tt,n:20,col:'140,255,160',up:2.2,life:1000,area:u.rw});F.burst(p.x,p.y,{t:tt,n:5,im:'x_heal',sp:2,g:-.1,life:950,sz:.2});F.keyf(u,{t:tt,d:800,fn:(v,k)=>{v.glow=k>=1?0:Math.sin(k*Math.PI);v.glowC='140,255,160'}});F.floatTxt('+'+n,p.x,p.y-u.rh*.12,{t:tt+150,col:'#9dffb0',size:20,rise:14});if(u.hp!=null)u.hp+=n})}
/* 見参（ゲームの kenzan と おなじ） */
function kenzanFx(u,sub,from){F.darken({t:150,d:2300,a:.4});/* 10/31 見参：大きな リングは なし */const t=enter(u,200,from,{noRing:1});
   /* 10/31 光の 放射は カードの うしろ・カードの 約1.6倍・外へ うすく */F.at(t,()=>F.rays(pos(u).x,pos(u).y,{t,d:1700,under:true,a:.32,len:Math.max(u.rw,u.rh)*.85,n:14,soft:true}));F.at(t,()=>{const p=pos(u);F.burst(p.x,p.y,{t,n:8,im:['x_spark','x_star'],sp:5,sz:.16,life:800});F.flash({t,d:180,a:.5});
     /* 見参の マーク：カードの 上はしの 上に 小さく（絵に かぶせない） */const d=u.el.ownerDocument,pp=d.createElement('div');pp.className='kwpop fx-bc';pp.style.setProperty('--k','#e8a23a');pp.innerHTML='<span class="i"><img src="../ui/u_k_bc.png" alt="" style="width:44px;height:44px;object-fit:contain"></span>';pp.style.top='-30px';pp.style.zoom='.7';u.el.appendChild(pp);setTimeout(()=>pp.remove(),1100)});
   /* 10/31 見参の カードと マークには ぜったい かぶせない。じぶんの 列なら あいての 列の 絵の 上（数字は よける）、あいての 列なら じぶんの 列の 絵の 上。列が からなら すき間 */
   F.at(t+80,tt=>{const other=F.units().filter(v=>v.side!==u.side&&!v.hidden);const y0=other.length?other.reduce((a,v)=>a+v.by,0)/other.length-u.rh*.2:MID();const pl=placeBig(sub,y0,u.el,{artOk:1,aboveBar:1,ownTop:44,sizes:[50,46,42,40],min:40,subSize:18,xs:[F.dims().W/2],range:other.length?u.rh*.6:null});F.slam('見参！',pl.x,pl.y,{t:tt,d:1500,size:pl.size,sub,subSize:18})});F.keyf(u,{t,d:1300,fn:(v,k)=>{v.glow=k>=1?0:Math.sin(k*Math.PI);v.sc=k>=1?1:1+.12*Math.sin(Math.min(1,k*3)*Math.PI)}})}
function enter(u,t=200,from,o={}){const {H}=F.dims();if(from==null){const hd=F.place(F.bd().hand);from=hd.y/H}const y0=u.y;/* 10/31 はじめの 場所に するのは 1コマめ（build の 中の pos(u) は 場の 場所の まま） */F.at(0,()=>{u.y=from;u.rot=-.4;u.sc=.6});
  F.tween(u,{t,d:380,y:y0,rot:0,sc:1.35});F.tween(u,{t:t+380,d:110,sc:1,e:E.io});
  F.at(t+490,()=>{const p=pos(u);if(!o.noRing){F.ring(p.x,p.y,{t:t+490,r1:110});F.ring(p.x,p.y,{t:t+620,col:'255,255,255',w:5,r1:150,d:800})}F.smoke(p.x,p.y+u.r,{t:t+490});F.shake({t:t+490,p:6})});
  return t+490}
function se_claw(t){F.at(t,()=>{try{if(window.SE2Z&&SE2Z.hush(t))return;if(window.LABSE_ON&&window.SE)SE.SFX.swish&&SE.SFX.swish()}catch(e){}})}
function ovF(u,o){const d0=o.draw;return F.overlay(u,Object.assign({},o,{draw:(...a)=>{const c=F.ctx();const bar=F.bd().hand.ownerDocument.querySelector('.bar');c.save();if(bar){const r=F.place(bar);c.beginPath();c.rect(-50,-50,F.dims().W+100,r.y-r.h/2+50);c.clip()}try{d0(...a)}finally{c.restore()}}}))}
function runup(a){const {H}=F.dims();const dir=pos(a).y>H*.45?1:-1;F.keyf(a,{t:0,d:330,fn:(u,k)=>{u.oy=26*dir*E.io(k);u.sc=1-.06*k}});F.keyf(a,{t:330,d:140,fn:(u,k)=>{u.oy=k>=1?0:26*dir*(1-E.o(k))-8*dir*Math.sin(k*Math.PI);u.sc=k>=1?1:.94+.1*Math.sin(k*Math.PI)+.06*k}})}
/* 10/31 キャンバスの ダメージ数字（-2 など）も 擬音の よける ものに いれる（場所と 出ている 時間）。
   おなじ子に 擬音と 数字が いっしょに 出るときは、数字を 擬音と 反対の ななめへ */
const NUMR=[],ONOR=[];
const numDx=(u,t)=>{if(!ONOR.some(q=>q.u===u&&Math.abs(q.t-t)<300))return 0;const sd=pos(u).x<F.dims().W/2?1:-1;return -sd*u.rw*.32};
function hitAt(u,t,n,o={}){if(o.noTint){const ent={u,t0:t,t1:t+1100,s:'-'+n};NUMR.push(ent);F.at(t,()=>{const p=pos(u),dx=numDx(u,t);ent.x=p.x+dx;ent.y=p.y-20;F.floatTxt('-'+n,p.x+dx,p.y-20,{t,col:'#ffdddd',size:26,rise:p.y<F.dims().H*.42?14:46});u.hp=Math.max(0,u.hp-n)});return}const ent={u,t0:t,t1:t+1100,s:'-'+n};NUMR.push(ent);F.at(t,()=>{const p=pos(u);if(o.n!==0)F.burst(p.x,p.y,{t,n:o.n||8,im:o.im||'x_hit',sp:5,g:.1,life:500,sz:.3});const dx=numDx(u,t);ent.x=p.x+dx;ent.y=p.y-20;F.floatTxt('-'+n,p.x+dx,p.y-20,{t,col:'#ffdddd',size:26,rise:p.y<F.dims().H*.42?14:46});F.keyf(u,{t,d:300,fn:(u,k)=>{u.ox=(Math.random()-.5)*10*(1-k);u.tint=`rgba(255,40,40,${.45*(1-k)})`}});F.keyf(u,{t:t+300,d:20,fn:u=>{u.ox=0;u.tint=null}});u.hp=Math.max(0,u.hp-n)})}
function ko(u,t){F.keyf(u,{t,d:500,fn:(u,k)=>{u.gray=k;u.ox=(Math.random()-.5)*8;u.rot=k*.3}});F.tween(u,{t:t+500,d:280,sc:.2,alpha:0,e:E.io});F.at(t+560,()=>{const p=pos(u);F.smoke(p.x,p.y,{t:t+560,n:14,col:'230,220,210',spread:70,r:18});F.burst(p.x,p.y,{t:t+560,n:6,im:'x_star',sp:4,g:.05,life:800,sz:.2})});return t+780}
const u0=r=>r*1.25+6;
function freezeOn(u,t){F.at(t,()=>{const el=u.el,d=el.ownerDocument;el.classList.add('iced');const o=d.createElement('div');o.className='iceov';el.appendChild(o);
  o.animate([{clipPath:'inset(100% 0 0 0)'},{clipPath:'inset(0 0 0 0)'}],{duration:450,easing:'cubic-bezier(.2,.8,.3,1)',fill:'both'});
  const p=pos(u);{const up_=p.y<F.dims().H*.42,sd=p.x<F.dims().W/2?1:-1;ONOR.push({u,t});F.floatTxt('カチコチ！',p.x+sd*u.rw*.8,up_?p.y+u.rh*.08:onoY(p,u),{t,col:'#bff4ff',size:18,rise:12,rot:sd*-.22,self:u.el,free:up_})}
  /* つらら・氷の かたまり・きらり */const I1=F.ui('fx:04_19'),I2=F.ui('fx:04_18'),I3=F.ui('fx:04_20');
  F.overlay(u,{t,d:9000,draw:(x,y,r,e)=>{const c=F.ctx(),k=Math.min(1,e/450),w=u.rw,h=u.rh;c.save();c.globalAlpha=.95*k;
    if(I2.complete){const s=w*.75;c.drawImage(I2,x-w*.62,y+h*.5-s*.75*k,s,s*.85*k)}
    if(I3.complete){const s=w*.7;c.drawImage(I3,x+w*.62-s,y+h*.5-s*.8*k,s,s*.8*k)}
    const g=(e/1400)%1;if(g<.25){c.globalCompositeOperation='lighter';c.globalAlpha=Math.sin(g/.25*Math.PI);c.fillStyle='#fff';const gx=x-w/2+w*(g/.25);c.beginPath();c.arc(gx,y-h*.2+(g*40),3,0,7);c.fill()}
    c.restore()}})})}

/* ===== こうげき（キャラの とくちょう ごと）用 ===== */
const SA=(art,atk=2,foe='jab')=>({foes:[{art:foe,atk:2,hp:9}],mine:[{art,atk,hp:3}]});
function lunge(a,tg,t,o={}){const {d=180,back=380,frac=.85,windup=0,lift=0}=o;const pa=pos(a),pt=pos(tg);const w0=windup?18:0;
  if(windup)F.keyf(a,{t,d:windup,fn:(u,k)=>{u.oy=18*E.o(k);u.sc=1+.12*E.o(k)}});
  const t1=t+windup;F.keyf(a,{t:t1,d,fn:(u,k)=>{u.ox=(pt.x-pa.x)*frac*E.io(k);u.oy=w0+((pt.y-pa.y)*frac-w0)*E.io(k)-Math.sin(k*Math.PI)*lift}});
  F.keyf(a,{t:t1+d,d:back,fn:(u,k)=>{u.ox=(pt.x-pa.x)*frac*(1-E.o(k));u.oy=(pt.y-pa.y)*frac*(1-E.o(k));u.sc=1+(windup?.12:0)*(1-k)}});return t1+d}
/* ギュッ・パリーン！などの 音の 文字：キャラの よこに すこし はなして、ななめに */
const LSE=(()=>{let A=null;const ac=()=>{if(!window.LABSE_ON||(window.SE2Z&&SE2Z.planned))return null;try{A=A||new (window.AudioContext||window.webkitAudioContext)();if(A.state==='suspended')A.resume()}catch(e){}return A};
 const tone=(f,d,o={})=>{const a=ac();if(!a)return;const t=a.currentTime+(o.at||0),os=a.createOscillator(),g=a.createGain();os.type=o.type||'sine';os.frequency.setValueAtTime(f,t);if(o.slide)os.frequency.exponentialRampToValueAtTime(o.slide,t+d);g.gain.setValueAtTime(o.vol||.08,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);os.connect(g).connect(a.destination);os.start(t);os.stop(t+d+.02)};
 const noise=(d,o={})=>{const a=ac();if(!a)return;const t=a.currentTime+(o.at||0),b=a.createBuffer(1,a.sampleRate*d,a.sampleRate),ch=b.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=(Math.random()*2-1)*(1-i/ch.length);const s=a.createBufferSource();s.buffer=b;const fl=a.createBiquadFilter();fl.type=o.type||'lowpass';fl.frequency.value=o.freq||1000;const g=a.createGain();g.gain.value=o.vol||.1;s.connect(fl).connect(g).connect(a.destination);s.start(t)};
 return {grow(){for(let i=0;i<5;i++)tone(140+i*30,.22,{vol:.05,at:i*.09,slide:260+i*40,type:'triangle'});noise(.5,{vol:.05,freq:600})},pop(){tone(260,.07,{vol:.09,slide:1500});noise(.05,{vol:.08,freq:2500,type:'highpass'})}}})();
function ono(tg,s,t,o={}){ONOR.push({u:tg,t});F.at(t,tt=>{const p=pos(tg);const sd=p.x<F.dims().W/2?1:-1;F.floatTxt(s,p.x+sd*tg.rw*.78,onoY(p,tg)+(o.dy||0),{t:tt,size:o.size||17,col:o.col||'#fff',rise:12,rot:sd*-.22,self:tg.el})})}
function hitFx(tg,t,n,o={}){const {im='x_hit',icon=null,isz=80,shake=6,txt=null,col='#fff'}=o;if(txt)ONOR.push({u:tg,t});F.at(t,tt=>{const p=pos(tg);if(icon)F.icon(icon,p.x,p.y,{t:tt,d:420,sz:isz});if(shake)F.shake({t:tt,p:shake});if(txt){const sd=p.x<F.dims().W/2?1:-1;F.floatTxt(txt,p.x+sd*tg.rw*.78,onoY(p,tg),{t:tt,size:17,col,rise:12,rot:sd*-.22,self:tg.el})}});hitAt(tg,t,n,{im})}
function throwHit(a,tg,t,o){const {d=600}=o;F.shot(pos(a),pos(tg),Object.assign({t,d},o));return t+d}
/* ===== 10/31 ゲームに 入った 新しい 演出（ゲームの f77_cfx / f91_cfxwire と おなじ 見た目） ===== */
const BDOC=()=>document.getElementById('bf').contentDocument;

 const close=()=>{const o=d.querySelector('.zkSheet');if(o)o.remove()};

  const im=(window.ZKIMG&&ZKIMG['img/'+u.art+'.webp'])||('img/'+u.art+'.webp');
