<script>
const F=FX,{P,E}=F;
const U=i=>F.units()[i];
const pos=u=>F.P(u);
/* 文字を 出す 高さ：あいての 場と じぶんの 場の あいだ */
const MID=()=>{const e=F.place(F.bd().units[0].parentNode),a=F.place(document.getElementById('bf').contentDocument.getElementById('af'));return (e.y+e.h/2+a.y-a.h/2)/2};
const hero=s=>F.P(F.heroes()[s]);
/* よく つかう 場面 */
const S1={foes:[{art:'jab',atk:2,hp:3},{art:'iguana',atk:2,hp:2}],mine:[{art:'dog',atk:2,hp:3},{art:'juko',atk:2,hp:4}]};
const S2={foes:[{art:'jab',atk:2,hp:3},{art:'iguana',atk:2,hp:2},{art:'kurogoke',atk:2,hp:2}],mine:[{art:'dog',atk:2,hp:3}]};
/* 出てくる 動き（共通） */
function enter(u,t=200,from){const {H}=F.dims();if(from==null){const hd=F.place(F.bd().hand);from=hd.y/H}const y0=u.y;u.y=from;u.rot=-.4;u.sc=.6;
  F.tween(u,{t,d:380,y:y0,rot:0,sc:1.35});F.tween(u,{t:t+380,d:110,sc:1,e:E.io});
  F.at(t+490,()=>{const p=pos(u);F.ring(p.x,p.y,{t:t+490,r1:110});F.ring(p.x,p.y,{t:t+620,col:'255,255,255',w:5,r1:150,d:800});F.smoke(p.x,p.y+u.r,{t:t+490});F.shake({t:t+490,p:6})});
  return t+490}
function se_claw(t){F.at(t,()=>{try{if(window.LABSE_ON&&window.SE)SE.SFX.swish&&SE.SFX.swish()}catch(e){}})}
function ovF(u,o){const d0=o.draw;return F.overlay(u,Object.assign({},o,{draw:(...a)=>{const c=F.ctx();const bar=F.bd().hand.ownerDocument.querySelector('.bar');c.save();if(bar){const r=F.place(bar);c.beginPath();c.rect(-50,-50,F.dims().W+100,r.y-r.h/2+50);c.clip()}try{d0(...a)}finally{c.restore()}}}))}
function runup(a){const {H}=F.dims();const dir=pos(a).y>H*.45?1:-1;F.keyf(a,{t:0,d:330,fn:(u,k)=>{u.oy=26*dir*E.io(k);u.sc=1-.06*k}});F.keyf(a,{t:330,d:140,fn:(u,k)=>{u.oy=k>=1?0:26*dir*(1-E.o(k))-8*dir*Math.sin(k*Math.PI);u.sc=k>=1?1:.94+.1*Math.sin(k*Math.PI)+.06*k}})}
function hitAt(u,t,n,o={}){F.at(t,()=>{const p=pos(u);if(o.n!==0)F.burst(p.x,p.y,{t,n:o.n||8,im:o.im||'x_hit',sp:5,g:.1,life:500,sz:.3});F.floatTxt('-'+n,p.x,p.y-20,{t,col:'#ffdddd',size:26});F.keyf(u,{t,d:300,fn:(u,k)=>{u.ox=(Math.random()-.5)*10*(1-k);u.tint=`rgba(255,40,40,${.45*(1-k)})`}});F.keyf(u,{t:t+300,d:20,fn:u=>{u.ox=0;u.tint=null}});u.hp=Math.max(0,u.hp-n)})}
function ko(u,t){F.keyf(u,{t,d:500,fn:(u,k)=>{u.gray=k;u.ox=(Math.random()-.5)*8;u.rot=k*.3}});F.tween(u,{t:t+500,d:280,sc:.2,alpha:0,e:E.io});F.at(t+560,()=>{const p=pos(u);F.smoke(p.x,p.y,{t:t+560,n:14,col:'230,220,210',spread:70,r:18});F.burst(p.x,p.y,{t:t+560,n:6,im:'x_star',sp:4,g:.05,life:800,sz:.2})});return t+780}
const u0=r=>r*1.25+6;
function freezeOn(u,t){F.at(t,()=>{const el=u.el,d=el.ownerDocument;el.classList.add('iced');const o=d.createElement('div');o.className='iceov';el.appendChild(o);
  o.animate([{clipPath:'inset(100% 0 0 0)'},{clipPath:'inset(0 0 0 0)'}],{duration:450,easing:'cubic-bezier(.2,.8,.3,1)',fill:'both'});
  const p=pos(u);F.floatTxt('カチコチ！',p.x,p.y-u.rh/2-10,{t,col:'#bff4ff',size:20});
  /* つらら・氷の かたまり・きらり */const I1=F.ui('fx:04_19'),I2=F.ui('fx:04_18'),I3=F.ui('fx:04_20');
  F.overlay(u,{t,d:9000,draw:(x,y,r,e)=>{const c=F.ctx(),k=Math.min(1,e/450),w=u.rw,h=u.rh;c.save();c.globalAlpha=.95*k;
    if(I2.complete){const s=w*.75;c.drawImage(I2,x-w*.62,y+h*.5-s*.75*k,s,s*.85*k)}
    if(I3.complete){const s=w*.7;c.drawImage(I3,x+w*.62-s,y+h*.5-s*.8*k,s,s*.8*k)}
    const g=(e/1400)%1;if(g<.25){c.globalCompositeOperation='lighter';c.globalAlpha=Math.sin(g/.25*Math.PI);c.fillStyle='#fff';const gx=x-w/2+w*(g/.25);c.beginPath();c.arc(gx,y-h*.2+(g*40),3,0,7);c.fill()}
    c.restore()}})})}

/* ===== こうげき（キャラの とくちょう ごと）用 ===== */
const SA=(art,atk=2,foe='jab')=>({foes:[{art:foe,atk:2,hp:9}],mine:[{art,atk,hp:3}]});
function lunge(a,tg,t,o={}){const {d=180,back=380,frac=.85,windup=0,lift=0}=o;const pa=pos(a),pt=pos(tg);const w0=windup?18:0;
  if(windup)F.keyf(a,{t,d:windup,fn:(u,k)=>{u.oy=18*E.o(k);u.sc=1+.12*E.o(k)}});
  const t1=t+windup;F.keyf(a,{t:t1,d,fn:(u,k)=>{u.ox=(pt.x-pa.x)*frac*E.io(k);u.oy=w0+((pt.y-pa.y)*frac-w0)*E.io(k)-Math.sin(k*Math.PI)*lift}});
  F.keyf(a,{t:t1+d,d:back,fn:(u,k)=>{u.ox=(pt.x-pa.x)*frac*(1-E.o(k));u.oy=(pt.y-pa.y)*frac*(1-E.o(k));u.sc=1+(windup?.12:0)*(1-k)}});return t1+d}
/* ギュッ・パリーン！などの 音の 文字：キャラの よこに すこし はなして、ななめに */
const LSE=(()=>{let A=null;const ac=()=>{if(!window.LABSE_ON)return null;try{A=A||new (window.AudioContext||window.webkitAudioContext)();if(A.state==='suspended')A.resume()}catch(e){}return A};
 const tone=(f,d,o={})=>{const a=ac();if(!a)return;const t=a.currentTime+(o.at||0),os=a.createOscillator(),g=a.createGain();os.type=o.type||'sine';os.frequency.setValueAtTime(f,t);if(o.slide)os.frequency.exponentialRampToValueAtTime(o.slide,t+d);g.gain.setValueAtTime(o.vol||.08,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);os.connect(g).connect(a.destination);os.start(t);os.stop(t+d+.02)};
 const noise=(d,o={})=>{const a=ac();if(!a)return;const t=a.currentTime+(o.at||0),b=a.createBuffer(1,a.sampleRate*d,a.sampleRate),ch=b.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=(Math.random()*2-1)*(1-i/ch.length);const s=a.createBufferSource();s.buffer=b;const fl=a.createBiquadFilter();fl.type=o.type||'lowpass';fl.frequency.value=o.freq||1000;const g=a.createGain();g.gain.value=o.vol||.1;s.connect(fl).connect(g).connect(a.destination);s.start(t)};
 return {grow(){for(let i=0;i<5;i++)tone(140+i*30,.22,{vol:.05,at:i*.09,slide:260+i*40,type:'triangle'});noise(.5,{vol:.05,freq:600})},pop(){tone(260,.07,{vol:.09,slide:1500});noise(.05,{vol:.08,freq:2500,type:'highpass'})}}})();
function ono(tg,s,t,o={}){F.at(t,tt=>{const p=pos(tg);const sd=p.x<F.dims().W/2?1:-1;F.floatTxt(s,p.x+sd*tg.rw*.78,p.y-tg.rh*.7+(o.dy||0),{t:tt,size:o.size||17,col:o.col||'#fff',rise:12,rot:sd*-.22})})}
function hitFx(tg,t,n,o={}){const {im='x_hit',icon=null,isz=80,shake=6,txt=null,col='#fff'}=o;F.at(t,tt=>{const p=pos(tg);if(icon)F.icon(icon,p.x,p.y,{t:tt,d:420,sz:isz});if(shake)F.shake({t:tt,p:shake});if(txt){const sd=p.x<F.dims().W/2?1:-1;F.floatTxt(txt,p.x+sd*tg.rw*.78,p.y-tg.rh*.7,{t:tt,size:17,col,rise:12,rot:sd*-.22})}});hitAt(tg,t,n,{im})}
function throwHit(a,tg,t,o){const {d=600}=o;F.shot(pos(a),pos(tg),Object.assign({t,d},o));return t+d}
/* ===== 10/31 ゲームに 入った 新しい 演出（ゲームの f77_cfx / f91_cfxwire と おなじ 見た目） ===== */
const BDOC=()=>document.getElementById('bf').contentDocument;
function bcss(id,txt){const d=BDOC();if(d.getElementById(id))return;const s=d.createElement('style');s.id=id;s.textContent=txt;d.head.appendChild(s)}
/* バフ：光の柱は 足もとに 置いたまま 下から じわっと 出す。キラキラは キャラを ぐるっと つつみながら のぼる */
function buffFx(u,t=0){const I=F.ui('x_beam'),SPK=F.ui('x_spark'),D=1500;let b=null;
 F.overlay(u,{t,d:D,draw:(x,y,r,e)=>{if(!I.complete)return;if(!b)b={x,y};const c=F.ctx(),fw=u.rw*1.45,fh=fw*(147/150),fy=b.y+u.rh*.5+fw*.06;const rv=E.o(Math.min(1,e/450)),a=Math.max(0,Math.min(1,e/300,(D-e)/400));c.save();c.beginPath();c.rect(b.x-fw,fy-fh*rv,fw*2,fh*rv+4);c.clip();c.globalCompositeOperation='lighter';c.globalAlpha=.72*a;c.drawImage(I,b.x-fw/2,fy-fh,fw,fh);c.restore()}});
 const N=14,Q=Array.from({length:N},(_,i)=>({a0:i/N*Math.PI*2,dl:(i%7)*70,sz:.5+Math.random()*.5,sp:1+Math.random()*.4}));
 F.overlay(u,{t,d:D,draw:(x,y,r,e)=>{if(!SPK.complete)return;const c=F.ctx();for(const q of Q){const ee=e-150-q.dl;if(ee<0)continue;const k=ee/900*q.sp;if(k>=1)continue;const ang=q.a0+k*Math.PI*2.2,rx=u.rw*.62*(1-k*.35),z=Math.sin(ang);const px=x+Math.cos(ang)*rx,py=y+u.rh*.5-k*u.rh*1.2+z*6;const s=(10+12*q.sz)*(.75+.25*(z+1)/2)*(k>.75?(1-k)/.25:1);c.save();c.globalCompositeOperation='lighter';c.globalAlpha=(z<0?.55:1)*Math.min(1,k*6);c.translate(px,py);c.rotate(k*2);c.drawImage(SPK,-s/2,-s/2,s,s);c.restore()}}});
 F.keyf(u,{t:t+150,d:1100,fn:(v,k)=>{v.glow=k>=1?0:Math.sin(k*Math.PI)*.9;v.glowC='255,211,74'}})}
/* 牢屋：牢屋の 絵を そのまま 上に（キャラの 形に 切らない）。キャラは 暗く。数字・マークより 下 */
const JAIL_CSS=`.u.jailed:not(.dig):not(.sink){filter:none!important}
.u.jailed:not(.dig):not(.sink) .art{filter:grayscale(.6) brightness(.45)!important}
.u.jailed:not(.dig):not(.sink)::after{inset:-7% -11%!important;border-radius:0!important;box-shadow:none!important;background:url(fx/new/jail_bars.webp) center/100% 100% no-repeat!important;z-index:5!important;filter:none!important}
.u.jailed.jin::after{opacity:0}`;
/* こうげきできる子の マーク（いまの UI の こうげきアイコン。古い atk.png は つかわない） */
const SWORD_CSS='.u .sword{font-size:0!important;left:-14px;top:-16px}.u .sword img{width:30px;height:30px;display:block}';
/* 手配書の マーク：はばに よゆう・手配書の アイコン */
const WANTED_CSS=`.u .pills{width:max-content}
.pill.wanted{flex:none;padding:0 7px 0 2px!important;white-space:nowrap}
.pill.wanted img{height:1.5em!important;margin:-3px 1px -3px 0!important}`;
/* 山札：あつみは 上限つき・カードの 大きさの 中に おさめる。数字は わくの 中 */
const DECK_CSS=`.deckpile.d3.d3fit .dk i{inset:0 auto auto 0;width:auto;height:auto}
.deckpile.d3.d3fit .dk b{right:6px;bottom:6px}
#pile.d3fit{height:58px;width:44px;align-self:center}

#foeStage .deckpile.red.d3fit .dkn{left:calc(100% + 4px);top:50%;transform:translateY(-50%)}`;
/* 文字は 数字（攻撃／体力・親分の 体力・コイン）に かぶせない。かぶるなら 上へ、だめなら 反対がわへ（ゲームの clearNum と おなじ） */
function ftC(str,x,y,o={}){try{const size=(o.size||22)*1.2,rise=o.rise==null?46:o.rise,{W}=F.dims();const w=String(str).length*size*1.15+10,h=size*1.3+rise;
 const obs=[...BDOC().querySelectorAll('.u .stat,.hero .hp,.fport .hp,#coins,.fside .coins')].map(e=>e.getBoundingClientRect()).filter(r=>r.width);
 const hit=(x,y)=>obs.find(r=>x+w/2>r.left&&x-w/2<r.right&&y+size*.7>r.top&&y-h<r.bottom);
 x=Math.max(w/2+4,Math.min(W-w/2-4,x));for(let i=0;i<4;i++){const r=hit(x,y);if(!r)break;y=r.top-size*.7-2;if(y-h<40){y=Math.max(40+h,y);x=Math.max(w/2+4,Math.min(W-w/2-4,2*(r.left+r.width/2)-x+(x<r.left?w:-w)))}}}catch(e){}
 return F.floatTxt(str,x,y,o)}
function deckFit(el,n){if(!el)return;const red=el.classList.contains('red');const dk=el.querySelector('.dk');if(!dk)return;const T=n<=0?0:Math.min(red?4:5,1+Math.ceil(n/10));const L=n<=0?0:Math.min(n,T+1);let h='<b></b>';
 if(!n)h+='<i class="ghost"></i>';else for(let k=0;k<L;k++){const o=L>1?(L-1-k)*T/(L-1):0;h+='<i class="'+(k===L-1?'top':'')+'" style="right:'+T+'px;bottom:'+T+'px;transform:translate('+o.toFixed(2)+'px,'+o.toFixed(2)+'px)"></i>'}
 dk.innerHTML=h;el.classList.add('d3fit');el.classList.toggle('empty',!n);el.dataset.n=n;const b=el.querySelector('.dkn');if(b)b.textContent=n}
const LIST=[
 {cat:'きほん',items:[
  {k:'kenzan',n:'見参！',d:'カードを 出した しゅんかん',stage:{foes:S1.foes,mine:[{art:'dog'},{art:'eagle',atk:6,hp:7}]},total:2700,build(){const u=U(3);F.darken({t:150,d:2700});const t=enter(u);
   F.at(t,()=>F.rays(pos(u).x,pos(u).y,{t,d:2100,under:true,a:.45}));F.at(t,()=>{const p=pos(u);F.burst(p.x,p.y,{t,n:8,im:['x_spark','x_star'],sp:5,sz:.16,life:800});F.flash({t,d:200,a:.6})});
   F.slam('見参！',F.dims().W/2,MID()-6,{t:t+120,d:2200,sub:'空から 見まもっておる！'});F.keyf(u,{t,d:2000,fn:(u,k)=>{u.glow=Math.sin(k*Math.PI)}})}},
  {k:'yarare',n:'やられたら',d:'たおれた ときに 出る 効果',stage:{foes:S1.foes,mine:[{art:'new03',atk:4,hp:1},{art:'juko'}]},total:3500,build(){const u=U(2);ko(u,100);const p0=pos(u);
   F.at(900,()=>{F.icon('u_k_dr',p0.x,p0.y,{t:900,d:900,sz:70,bob:4});F.ring(p0.x,p0.y,{t:900,col:'170,120,255',r1:90})});
